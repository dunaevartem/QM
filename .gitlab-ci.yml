stages:
  - lint
  - build
  - test   
  - push
  - scan
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  GOPATH: $CI_PROJECT_DIR/.go
  GOTOOLCHAIN: "auto"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .go/pkg/mod/

checkov_scan:
  stage: lint
  image: 
    name: bridgecrew/checkov:latest
    entrypoint: [""]
  script:
    # Сканируем папку с чартами. 
    # --soft-fail позволит пайплайну пройти, если хочешь просто посмотреть ошибки.
    # Если хочешь жестко блокировать — убери --soft-fail.
    - checkov -d ./charts/chat-app --framework helm --quiet --soft-fail

kube_score:
  stage: lint
  image: 
    name: zegl/kube-score:latest
    entrypoint: [""]
  script:
    # Генерируем итоговый YAML из Helm и проверяем его
    - >
      helm template chat ./charts/chat-app 
      --set registry.url=$CI_REGISTRY 
      --set image.tag=$CI_COMMIT_SHORT_SHA
      | kube-score score -
      --ignore-test container-security-context-readonlyrootfilesystem
      --ignore-test container-security-context-user-group-id

build_app:
  stage: build
  image: golang:1.24-alpine
  script:
    - go build -o chat-server ./cmd/main.go
  artifacts:
    paths:
      - chat-server

run_tests:
  stage: test
  image: golang:1.24-alpine
  script:
    # Запускаем все тесты из папки /test
    - go test -v ./test/...
  dependencies:
    - build_app

push_image:
  stage: push
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "${IMAGE_TAG}"

container_scan:
  stage: scan
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    # Указываем Trivy использовать локальную папку для кэша
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    paths:
      - .trivycache/
  script:
    - export TRIVY_USERNAME=$CI_REGISTRY_USER
    - export TRIVY_PASSWORD=$CI_REGISTRY_PASSWORD
    # Проверяем образ и валим пайплайн, если найдены КРИТИЧЕСКИЕ уязвимости
    - trivy image --exit-code 1 --severity CRITICAL --no-progress $IMAGE_TAG
  allow_failure: false  # Если найдена дыра, выдает ошибку пайплайна и останавливает работу.

deploy:
  stage: deploy
  image: 
    name: alpine/k8s:1.29.2
    entrypoint: [""]
  variables:
    KUBECONFIG: $KUBECONFIG_FILE
  script:
    # 1. Namespace создаем один раз (лучше оставить для страховки)
    - kubectl create namespace chat-app --dry-run=client -o yaml | kubectl apply -f -

    # 2. Чистый деплой через Helm
    - >
      helm upgrade --install chat ./charts/chat-app 
      --namespace chat-app
      --set image.repository=$CI_REGISTRY_IMAGE    
      --set image.tag=$CI_COMMIT_SHORT_SHA 
      --set registry.url=$CI_REGISTRY 
      --wait 
      --timeout 300s
  only:
    - master
