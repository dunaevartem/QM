stages:
  - build
  - test   
  - push
  - pre-deploy
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  GOPATH: $CI_PROJECT_DIR/.go
  GOTOOLCHAIN: "auto"
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .go/pkg/mod/

build_app:
  stage: build
  image: golang:1.24-alpine
  script:
    - go build -o chat-server ./cmd/main.go
  artifacts:
    paths:
      - chat-server

# --- НОВАЯ ЗАДАЧА ---
run_tests:
  stage: test
  image: golang:1.24-alpine
  script:
    # Запускаем все тесты из папки /test
    - go test -v ./test/...
  dependencies:
    - build_app

push_image:
  stage: push
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "${IMAGE_TAG}"

deploy:
  stage: deploy
  image: 
    name: alpine/k8s:1.29.2 # Этот образ содержит и helm, и kubectl
    entrypoint: [""]
  variables:
    KUBECONFIG: $KUBECONFIG_FILE
  script:
    # 1. Создаем namespace заранее (kubectl create namespace --dry-run=client -o yaml | kubectl apply -f -)
    - kubectl create namespace chat-app --dry-run=client -o yaml | kubectl apply -f -

    # 2. Создаем секрет для скачивания образов из GitLab Registry
    - >
      kubectl create secret docker-registry gitlab-registry-key
      --namespace chat-app
      --docker-server=$CI_REGISTRY
      --docker-username=$CI_DEPLOY_USER
      --docker-password=$CI_DEPLOY_PASSWORD
      --dry-run=client -o yaml | kubectl apply -f -

    # 3. Создаем секрет для пароля базы данных (чтобы Deployment мог его прочитать)
    - >
      kubectl create secret generic postgres-secret
      --namespace chat-app
      --from-literal=password=$POSTGRES_PASSWORD
      --dry-run=client -o yaml | kubectl apply -f -

    # 4. Ваш привычный деплой через Helm
    - >
      helm upgrade --install chat ./charts/chat-app 
      --namespace chat-app
      --set image.repository=$CI_REGISTRY_IMAGE    
      --set image.tag=$CI_COMMIT_SHORT_SHA 
      --wait 
      --timeout 300s
  only:
    - master
