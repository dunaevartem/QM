apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend # Имя вашего SecretStore в кластере
    kind: ClusterSecretStore
  target:
    name: postgres-secret # Имя K8s-секрета, который создаст оператор
    creationPolicy: Owner
  data:
  - secretKey: password
    remoteRef:
      key: secret/data/chat-app/db # Путь в Vault
      property: password           # Ключ внутри секрета Vault