apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: {{ .Release.Namespace }} # Автоматически подхватит chat-app из команды helm
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "chat-app-role" # Эта роль должна быть заранее создана ВНУТРИ самого Vault
          serviceAccountRef:
            name: default