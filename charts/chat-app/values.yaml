replicaCount: 1

image:
  repository: "repository-will-be-set-in-ci"  # Подставится из пайплайна
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

postgres:
  password: ""

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
ingress:
  enabled: true
  className: "nginx" # Убедитесь, что у вас установлен ingress-nginx
  hosts:
    - host: chat.local # Придумайте домен
      paths:
        - path: /
          pathType: Prefix
imagePullSecrets:
- name: gitlab-registry-key