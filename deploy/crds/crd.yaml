apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # Имя должно соответствовать формату: <plural>.<group>
  name: myconfigs.chat.local
spec:
  # Группа API (обычно домен вашей компании)
  group: chat.local
  # Список версий
  versions:
    - name: v1
      served: true
      storage: true
      # Схема валидации (что можно писать внутри ресурса)
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                environment:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
  # Названия для использования в kubectl
  names:
    kind: MyConfig
    plural: myconfigs
    singular: myconfig
    shortNames:
    - mc
  # Область действия: Namespaced (для конкретного проекта) или Cluster (для всего кластера)
  scope: Namespaced